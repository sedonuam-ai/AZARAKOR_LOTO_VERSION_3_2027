<style>
/* Layout: neuf gros boutons numérotés en haut, puis la feuille générée telle qu'elle apparaît dans Excel : un tableau par pivot, huit blocs de grilles côte à côte. */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --surface2:#E3E9ED; --fg:#12202A; --muted:#566874; --line:#C9D4DA;
  --cold:#2F6FA8; --on-cold:#FFFFFF;
  --accent:#0A6B6B; --accent-fg:#FFFFFF; --pivot:#0A6B6B; --pivot-bg:#D6EBEA; --hit:#F2B33D; --on-hit:#1B1405; --bad:#B3261E; --gold:#B07A00;
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E161C; --surface:#16222A; --surface2:#1D2B35; --fg:#E6EEF2; --muted:#93A4AF; --line:#2B3C47;
  --accent:#4FC3B8; --accent-fg:#06201E; --pivot:#4FC3B8; --pivot-bg:#17393A; --hit:#E7A93B; --on-hit:#1B1405; --bad:#FF8A80; --gold:#FFD34D; --cold:#6BA8E0; --on-cold:#08141F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E161C; --surface:#16222A; --surface2:#1D2B35; --fg:#E6EEF2; --muted:#93A4AF; --line:#2B3C47;
  --accent:#4FC3B8; --accent-fg:#06201E; --pivot:#4FC3B8; --pivot-bg:#17393A; --hit:#E7A93B; --on-hit:#1B1405; --bad:#FF8A80; --gold:#FFD34D; --cold:#6BA8E0; --on-cold:#08141F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 14px/1.5 var(--f-body);
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
.eyebrow{font:500 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* Bandeau d'entête : rouge profond du logo, nom en dégradé doré. Même look en thème clair et sombre. */
header.brand{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;margin-top:16px;padding:16px 22px;border-radius:14px;
  background:radial-gradient(120% 160% at 0% 0%,#7E0D0D 0%,#4A0808 55%,#2E0505 100%);border:1px solid #C99700;box-shadow:0 0 0 3px #4A0808,0 0 0 4px #E0B33A55}
.logo{flex:none;width:96px;height:96px;border-radius:50%;display:block}
.bname{flex:1 1 260px;min-width:0}
h1{margin:0;font:700 40px/1.05 var(--f-display);letter-spacing:.02em;color:#F2B705;
  background:linear-gradient(180deg,#FFF0B3 0%,#F7C71E 45%,#C99700 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;overflow-wrap:anywhere}
.bname .tag{margin-top:6px;font:500 12px/1.4 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:#F1D98E}
.addr{font-style:normal;display:flex;flex-direction:column;gap:2px;font:500 14px/1.45 var(--f-mono);color:#F6E3B0;text-align:right}
.addr .city{font:600 14px/1.45 var(--f-body);letter-spacing:.12em;color:#F7C71E;margin-top:2px}
.intro{margin:14px 0 14px}
@media (max-width:640px){.addr{text-align:left;flex:1 1 100%}}
h2{font:600 20px/1.2 var(--f-display);margin:0}
h3{font:600 14px/1.2 var(--f-body);margin:0}
.note{color:var(--muted);font-size:13px;max-width:70ch}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:6px}
.gb{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;min-height:60px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;font:600 14px var(--f-body)}
.gb .n{flex:none;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--surface2);font:600 17px var(--f-mono)}
.gb small{display:block;font:400 11px var(--f-body);color:var(--muted);margin-top:2px}
.gb[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.gb[aria-pressed=true] .n{background:rgba(255,255,255,.22);color:inherit}
.gb[aria-pressed=true] small{color:inherit;opacity:.85}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:14px}
.row2{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
button.act{font:500 13px var(--f-body);cursor:pointer;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);padding:8px 14px;min-height:38px}
button.alt{font:500 13px var(--f-body);cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;min-height:38px}
.nums{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.nums span{font:500 12px var(--f-mono);min-width:30px;text-align:center;padding:3px 0;border-radius:4px;background:var(--surface2);font-variant-numeric:tabular-nums}
.nums span.own{background:var(--pivot-bg);color:var(--pivot);font-weight:600}
.pivots{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pivots a{font:500 13px var(--f-mono);padding:5px 10px;border-radius:6px;border:1px solid var(--line);color:var(--fg);text-decoration:none;background:var(--surface)}
.set{margin-top:18px;scroll-margin-top:12px}
.set h3{display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.set h3 .tag{font:400 12px var(--f-mono);color:var(--muted)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;font:400 12.5px var(--f-mono);font-variant-numeric:tabular-nums;width:max-content;min-width:100%}
th{font:500 11px var(--f-mono);color:var(--muted);text-align:center;padding:6px 0;background:var(--surface2);border-bottom:1px solid var(--line);letter-spacing:.02em}
td{text-align:center;padding:4px 0;min-width:30px;border-bottom:1px solid var(--line)}
td.p{background:var(--pivot-bg);color:var(--pivot);font-weight:600}
td.e,th.e{padding:0;min-width:0;width:14px;background:var(--bg);border-bottom:0}
td.rn{color:var(--muted);background:var(--surface2);min-width:28px;position:sticky;left:0}
th.rn{position:sticky;left:0}
tr:last-child td{border-bottom:0}
.toast{margin-left:8px;font-size:13px;color:var(--muted)}
textarea#tsv{width:100%;height:140px;margin-top:10px;font:12px var(--f-mono);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px}
#draw{margin-top:0}
.cells{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.cells input{width:64px;height:64px;text-align:center;font:600 28px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:0}
.cells input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.cells input.ok{border-color:var(--accent);background:var(--pivot-bg)}
.cells input.bad{border-color:var(--bad)}
.dmsg{min-height:20px;margin-top:8px;font-size:13px;color:var(--muted)}
.dmsg.err{color:var(--bad)}
td.hit,.nums span.hit{background:var(--hit);color:var(--on-hit);font-weight:600}
.sum{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sum span{background:var(--surface2);border-radius:6px;padding:4px 10px;font:500 12px var(--f-mono)}
td.gw{box-shadow:inset 0 3px 0 var(--gold),inset 0 -3px 0 var(--gold)}
td.gw.gl{box-shadow:inset 0 3px 0 var(--gold),inset 0 -3px 0 var(--gold),inset 3px 0 0 var(--gold)}
td.gw.gr{box-shadow:inset 0 3px 0 var(--gold),inset 0 -3px 0 var(--gold),inset -3px 0 0 var(--gold)}
.legend{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:26px;height:14px;border:3px solid var(--gold);border-radius:2px}
table.gt{width:100%;min-width:520px}
table.gt th,table.gt td{text-align:right;padding:7px 10px;min-width:0;font-size:13px}
table.gt th:first-child,table.gt td:first-child{text-align:left}
table.gt th small{display:block;font:400 10px var(--f-body);letter-spacing:0;color:var(--muted)}
table.gt tr.cur td{background:var(--pivot-bg)}
table.gt tr.cur td:first-child{font-weight:600}
table.gt tr.row{cursor:pointer}
.savebar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:12px}
.savebar .f{display:flex;flex-direction:column;gap:4px;flex:1 1 220px;min-width:0}
.savebar label{font:500 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.savebar input{font:500 14px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:38px;width:100%}
button.act[disabled]{opacity:.55;cursor:default}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.tile{background:var(--surface2);border-radius:8px;padding:10px 12px;min-width:0}
.tile .v{font:600 20px var(--f-mono);font-variant-numeric:tabular-nums}
.tile .l{font:500 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
table.cn{width:100%;min-width:680px}
table.cn th{text-align:left;padding:6px 10px;white-space:nowrap}
table.cn td{padding:5px 2px;min-width:0}
/* Compteurs : style "tableau de bord à chiffres" rouge sombre et or, volontairement différent des pivots (vert-bleu). */
#counter{border-top:4px solid #C99700}
table.cn td.cc{width:8.5%;line-height:1.1;padding:8px 2px;background:var(--surface)}
table.cn td.cc b{display:block;font:500 12px var(--f-mono);color:var(--muted);margin-bottom:4px}
.odo{display:inline-block;min-width:34px;padding:3px 7px;border-radius:5px;background:linear-gradient(180deg,#4A0808,#240404);border:1px solid #6B1A1A;
  color:#F7C71E;font:600 15px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.10)}
.odo.z{color:#9C7A33;background:#2A0606;border-color:#4A1212}
.odo.top{border-color:#F7C71E;box-shadow:0 0 0 2px #F7C71E55,inset 0 1px 0 rgba(255,255,255,.12)}
.odo.tot{font-size:14px;min-width:44px}
table.cn td.tt{padding:5px 10px;text-align:right}
table.cn th[scope=row]{color:var(--muted)}
#counter .tile{background:linear-gradient(180deg,#4A0808,#2A0505);border:1px solid #6B1A1A}
#counter .tile .l{color:#F1D98E}
#counter .tile .v{color:#F7C71E}
#counter button.sm[aria-pressed=true]{background:#7E0D0D;border-color:#C99700;color:#F7C71E}
.set h3 .tag.cnt{background:linear-gradient(180deg,#4A0808,#2A0505);color:#F7C71E;border:1px solid #6B1A1A;border-radius:5px;padding:1px 8px;font:600 12px var(--f-mono)}
.hist{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:12px}
.hist .r{display:flex;gap:10px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);font:400 12.5px var(--f-mono);flex-wrap:wrap}
.hist .r:last-child{border-bottom:0}
.hist .r .lb{font:500 13px var(--f-body);min-width:90px}
.hist .r .d{color:var(--muted);margin-left:auto}
button.sm{font:500 12px var(--f-body);cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:4px 10px;min-height:30px}
button.sm[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
button.danger{border-color:var(--bad);color:var(--bad)}
@media (max-width:520px){h1{font-size:30px}.logo{width:76px;height:76px}header.brand{padding:14px 16px}.cells input{width:54px;height:56px;font-size:24px}}
.sv{display:inline-block;min-width:34px;padding:3px 6px;border-radius:5px;background:var(--surface2);color:var(--fg);font:600 14px var(--f-mono);font-variant-numeric:tabular-nums}
.sv.hot{background:var(--hit);color:var(--on-hit)}
.sv.cold{background:var(--cold);color:var(--on-cold)}
.sp{display:block;font:400 10px var(--f-mono);color:var(--muted);margin-top:2px}
table.st{min-width:680px}
.tile .v.sm2{font-size:15px;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:baseline;gap:6px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface2)}
.chip i{font:500 11px var(--f-mono);color:var(--muted);font-style:normal}
.chip b{font:600 15px var(--f-mono)}
.chip small{font:400 11px var(--f-body);color:var(--muted)}
.chip.pick{background:var(--hit);color:var(--on-hit);border-color:var(--hit)}
.chip.pick i,.chip.pick small{color:inherit;opacity:.8}
.warn{margin-top:12px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);border-left:4px solid var(--hit);background:var(--surface2);font-size:13px}
</style>

body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>

<script>
//ENGINE-START
const grp=n=>n%9||9;
const GROUPS={};for(let g=1;g<=9;g++)GROUPS[g]=[];for(let n=1;n<=90;n++)GROUPS[grp(n)].push(n);
const PAIRS=[];for(let a=0;a<5;a++)for(let b=a+1;b<5;b++)PAIRS.push([a,b]);
const blocksOf=g=>[1,2,3,4,5,6,7,8,9].filter(h=>h!==g);
// Option 1 : 10 grilles par bloc (2 paires parmi 5). Option 2 : 60 grilles par bloc (motif du fichier Excel, positions 0-9 dans le groupe compagnon).
let OPT=1;
const P2=[[0,1,2,3],[0,1,2,4],[0,1,3,4],[0,2,3,4],[0,1,4,5],[0,1,4,6],[0,1,5,6],[0,4,5,6],[0,1,6,7],[0,1,6,8],[0,1,7,8],[0,6,7,8],[0,1,2,3],[0,1,2,5],[0,1,3,5],[0,2,3,5],[0,1,4,5],[0,1,4,7],[0,1,5,7],[0,4,5,7],[0,1,6,7],[0,1,6,9],[0,1,7,9],[0,6,7,9],[1,2,3,4],[1,2,3,5],[1,4,5,6],[1,4,5,7],[1,6,7,8],[1,6,7,9],[2,3,4,5],[2,3,4,6],[2,3,5,6],[2,4,5,6],[3,4,5,6],[2,3,6,7],[2,3,6,8],[2,3,7,8],[2,6,7,8],[3,6,7,8],[2,3,4,5],[2,3,4,7],[2,3,5,7],[2,4,5,7],[3,4,5,7],[2,3,6,7],[2,3,6,9],[2,3,7,9],[2,6,7,9],[3,6,7,9],[4,5,6,7],[4,5,6,8],[4,5,7,8],[4,6,7,8],[5,6,7,8],[4,5,6,7],[4,5,6,9],[4,5,7,9],[4,6,7,9],[5,6,7,9]];
const NG=(o=OPT)=>o===2?60:10;                  // grilles par bloc
const STRIDE=(o=OPT)=>o===2?62:12;              // lignes entre deux pivots dans la feuille
function lineNums(p,h,i,o=OPT){const L=GROUPS[h];if(o===2){const q=P2[i];return [p,L[q[0]],L[q[1]],L[q[2]],L[q[3]]];}const [a,b]=PAIRS[i];return [p,L[2*a],L[2*a+1],L[2*b],L[2*b+1]];}
// Feuille complète comme dans Excel : 122 lignes (option 1) ou 620 lignes (option 2) x 90 colonnes (ligne 1 = les 90 numéros, grilles en A3:E12, I3:M12, ...)
function sheetMatrix(g){
  const M=Array.from({length:OPT===2?620:122},()=>Array(90).fill(null));
  const order=GROUPS[g].concat(...blocksOf(g).map(h=>GROUPS[h]));

    tiles=[['Numéro le plus froid',gap[ranked[0]]+' tirages · n° '+pad(ranked[0])],['Absents des '+Math.min(W,N)+' derniers',nw+' / 90'],['Jamais sortis',c.slice(1).filter(v=>v===0).length+' / 90'],['Tirages',N]];
    expl=`Froid = numéro absent des ${W} derniers tirages, avec le plus long écart en premier. Le chiffre est l'écart (tirages depuis la dernière sortie). En bleu : les 10 plus froids.`;
    tipf=n=>`N° ${n} : ${win[n]} sortie dans les ${Math.min(W,N)} derniers tirages, écart ${gap[n]}`;}
  else{const sc=P.sc;vals=sc;ranked=topList(sc,(a,b)=>sc[b]-sc[a]||gap[b]-gap[a],10);cls=n=>ranked.slice(0,5).includes(n)?'hot':'';
    const bt=backtest(MEM,W),rnd=25/90;
    tiles=[['Sélection du moment',ranked.slice(0,5).map(pad).join(' ')],['Note du n° '+pad(ranked[0]),sc[ranked[0]]+' / 100'],['Test sur le passé',bt.t?bt.avg.toFixed(2)+' bon / tirage':'trop peu de tirages'],['Hasard pur',rnd.toFixed(2)+' bon / tirage']];
    expl=`Prédiction = classement des numéros par une note de 0 à 100 : fréquence 35 %, chaleur sur les ${W} derniers tirages 40 %, retard (écart) 25 %. En orange : la sélection des 5 meilleures notes.`;
    tipf=n=>`N° ${n} : note ${sc[n]} / 100 (sorties ${c[n]}, ${win[n]} récentes, écart ${gap[n]})`;
    sub=null;P.bt=bt;}
  const rowsT=[1,2,3,4,5,6,7,8,9].map(g=>`<tr><th scope="row">GROUPE ${g}</th>${GROUPS[g].map(n=>`<td class="cc" title="${tipf(n)}"><b>${pad(n)}</b><span class="sv ${cls(n)}">${vals[n]}</span>${typeof sub==='function'?`<small class="sp">${sub(n)}</small>`:''}</td>`).join('')}</tr>`).join('');
  const chips=ranked.map((n,i)=>`<span class="chip${m==='pred'&&i<5?' pick':''}" title="${tipf(n)}"><i>${i+1}</i><b>${pad(n)}</b><small>${m==='pred'?vals[n]+'/100':m==='freq'?vals[n]+' fois':m==='chaud'?vals[n]+' fois':'écart '+gap[n]}</small></span>`).join('');
  const useW=(m==='chaud'||m==='froid'||m==='pred')?`<div class="seg" role="group" aria-label="Période récente"><span class="note" style="align-self:center">Période récente :</span>${wins}</div>`:'';
  const warn=m==='pred'?`<div class="warn" role="note"><b>À savoir.</b> Le tirage est un hasard : à chaque tirage, les 90 numéros ont la même chance (5 sur 90). Ce classement ne fait que résumer l'historique enregistré, il ne peut pas garantir un résultat. ${P.bt.t?`Pour vérifier honnêtement : sur les ${P.bt.t} derniers tirages, la sélection de 5 numéros (calculée à chaque fois avec les tirages précédents seulement) a trouvé en moyenne ${P.bt.avg.toFixed(2)} bon numéro par tirage (au moins un bon dans ${P.bt.any} tirages), contre ${(25/90).toFixed(2)} pour le hasard pur.`:'Enregistrez au moins 7 tirages pour voir ce test sur le passé.'}</div>`:'';
  el.innerHTML=head+useW+`<p class="note" style="margin-top:10px">${expl}</p>
    <div class="tiles">${tiles.map(([l,v])=>`<div class="tile"><div class="l">${l}</div><div class="v sm2">${v}</div></div>`).join('')}</div>
    <div class="eyebrow" style="margin-top:14px">${m==='pred'?'Les 10 meilleures notes (les 5 premières = sélection)':'Les 10 premiers'}</div><div class="chips">${chips}</div>${warn}
    <div class="scroll" style="margin-top:12px"><table class="cn st"><thead><tr><th>Groupe</th><th colspan="10">Les 90 numéros : ${m==='ecart'||m==='froid'?'écart':m==='freq'?'sorties':m==='chaud'?'sorties récentes':'note sur 100'}</th></tr></thead><tbody>${rowsT}</tbody></table></div>`;
}
{const _rc=renderCounter;renderCounter=function(){_rc();renderStats();};}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act3]');if(!a)return;
  if(a.dataset.act3==='m')smetric=a.dataset.m;else if(a.dataset.act3==='w')swin=+a.dataset.w;
  renderStats();
});
function saveDraw(){
  if(!DRAW||keyOf(DRAW)===lastSavedKey)return;
  const lab=document.getElementById('dlabel');
  MEM.push({label:(lab.value.trim()||'Tirage '+(MEM.length+1)),n:[...DRAW],t:Date.now()});
  lastSavedKey=keyOf(DRAW);saveMem();lab.value='';confirmClear=false;
  renderCounter();updateSave();renderSheet();
  dmsg.className='dmsg';dmsg.textContent='Tirage enregistré : '+MEM.length+' tirage'+(MEM.length>1?'s':'')+' en mémoire.';
}
document.getElementById('savebtn').addEventListener('click',saveDraw);
document.addEventListener('click',e=>{
  const d=e.target.closest('[data-del]');
  if(d){MEM.splice(+d.dataset.del,1);saveMem();lastSavedKey=null;renderCounter();updateSave();renderSheet();return;}
  const a=e.target.closest('[data-act2]');
  if(!a)return;
  if(a.dataset.act2==='cm')cmetric=a.dataset.m;
  else if(a.dataset.act2==='clearask')confirmClear=true;
  else if(a.dataset.act2==='clearno')confirmClear=false;
  else if(a.dataset.act2==='clearyes'){MEM=[];saveMem();lastSavedKey=null;confirmClear=false;renderSheet();}
  renderCounter();updateSave();
});
// ---- Saisie du tirage officiel : 5 cases à 2 chiffres, passage automatique à la case suivante
const cells=[0,1,2,3,4].map(i=>document.getElementById('d'+i));
const dmsg=document.getElementById('dmsg');
function readDraw(){
  const vals=cells.map(c=>c.value);
  const nums=vals.map(v=>v.length===2?+v:null);
  const inv=nums.map(n=>n!==null&&(n<1||n>90));
  const dup=nums.map((n,i)=>n!==null&&nums.some((m,j)=>j!==i&&m===n));
  cells.forEach((c,i)=>{c.classList.toggle('bad',inv[i]||dup[i]);c.classList.toggle('ok',nums[i]!==null&&!inv[i]&&!dup[i]);});
  let prev=DRAW;
  if(nums.every(n=>n!==null)&&!inv.some(Boolean)&&!dup.some(Boolean)){DRAW=new Set(nums);dmsg.className='dmsg';dmsg.textContent='Tirage pris en compte : '+nums.map(n=>String(n).padStart(2,'0')).join(' ')+'.';}
  else{DRAW=null;
    if(inv.some(Boolean)){dmsg.className='dmsg err';dmsg.textContent='Chaque numéro doit être entre 01 et 90.';}
    else if(dup.some(Boolean)){dmsg.className='dmsg err';dmsg.textContent='Un numéro apparaît deux fois : les 5 numéros doivent être différents.';}
    else{dmsg.className='dmsg';dmsg.textContent=vals.filter(v=>v.length===2).length+' numéro(s) sur 5 saisi(s).';}}
  try{localStorage.setItem('tsome-tirage-officiel',JSON.stringify(vals));}catch(e){}
  updateSave();
  const changed=(prev&&[...prev].sort().join()!==(DRAW?[...DRAW].sort().join():''))||(!prev&&DRAW);
  if(changed||(prev&&!DRAW)){renderSheet();renderCounter();}
}
function fillFrom(i,digits){          // répartit des chiffres sur les cases à partir de la case i (collage de plusieurs numéros)
  let k=i;
  for(let p=0;p+0<digits.length&&k<5;p+=2,k++)cells[k].value=digits.slice(p,p+2);
  cells[Math.min(k,4)].focus();
  const last=Math.min(k,4);if(cells[last])cells[last].select();
}
cells.forEach((c,i)=>{
  c.addEventListener('input',()=>{
    const d=c.value.replace(/\D/g,'');
    if(d.length>2){c.value=d.slice(0,2);fillFrom(i+1,d.slice(2));}
    else c.value=d;
    readDraw();
    if(c.value.length===2&&!c.classList.contains('bad')&&i<4){cells[i+1].focus();cells[i+1].select();}
  });
  c.addEventListener('keydown',e=>{
    if(/^[0-9]$/.test(e.key)&&c.value.length>=2&&c.selectionStart===c.selectionEnd)c.value='';   // case pleine : le nouveau chiffre remplace le numéro
    if(e.key==='Backspace'&&c.value===''&&i>0){e.preventDefault();cells[i-1].focus();cells[i-1].value=cells[i-1].value.slice(0,-1);readDraw();}
    else if(e.key==='ArrowLeft'&&i>0&&c.selectionStart===0){e.preventDefault();cells[i-1].focus();}
    else if(e.key==='ArrowRight'&&i<4&&c.selectionStart===c.value.length){e.preventDefault();cells[i+1].focus();}
    else if((e.key===' '||e.key===','||e.key==='Enter')&&c.value.length===1){   // un seul chiffre : complète par un zéro devant
      e.preventDefault();c.value='0'+c.value;readDraw();if(i<4){cells[i+1].focus();cells[i+1].select();}}
    else if((e.key===' '||e.key==='Enter')&&c.value.length===2&&i<4){e.preventDefault();cells[i+1].focus();cells[i+1].select();}
  });
  c.addEventListener('focus',()=>c.select());
  c.addEventListener('mouseup',e=>{if(c.value.length)e.preventDefault();});
  c.addEventListener('paste',e=>{
    const txt=(e.clipboardData||window.clipboardData).getData('text');
    const parts=txt.split(/[^0-9]+/).filter(Boolean);
    if(parts.length>1||txt.replace(/\D/g,'').length>2){
      e.preventDefault();
      const digits=parts.length>1?parts.map(p=>p.padStart(2,'0').slice(-2)).join(''):txt.replace(/\D/g,'');
      fillFrom(i,digits);readDraw();}
  });
});
document.getElementById('clear').addEventListener('click',()=>{cells.forEach(c=>{c.value='';c.classList.remove('ok','bad');});readDraw();cells[0].focus();});
try{const sv=JSON.parse(localStorage.getItem('tsome-tirage-officiel')||'null');if(Array.isArray(sv)&&sv.length===5)sv.forEach((v,i)=>{cells[i].value=String(v||'').replace(/\D/g,'').slice(0,2);});}catch(e){}
readDraw();
renderCounter();
renderBtns();renderSheet();
</script>
